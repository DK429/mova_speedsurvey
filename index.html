<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVA SPEED SURVEY</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
nav { display: flex; width: 100%; background: #eee; }
nav button { flex: 1; padding: 12px; font-size: 18px; border: none; cursor: pointer; background: #ddd; }
nav button.active { background: #555; color: #fff; }
.tab { display: none; padding: 16px; }
.tab.active { display: block; }

/* Canvas */
#canvas { 
  border: 2px solid #333; 
  background: #fff; 
  display: block; 
  margin: 10px auto; 
  width: 100%; 
  max-width: 480px; 
  height: 240px; /* increased height */
}

/* Metrics */
.metrics-bar-top, .metrics-bar-bottom {
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  max-width: 480px; 
  margin: 0 auto; 
  font-size: 14px; 
  font-family: monospace;
}
.metrics-bar-bottom { margin-top: 8px; }
.metrics-label { display: inline-block; width: 8ch; text-align: left; }
.metrics-value { display: inline-block; min-width: 14ch; text-align: right; }

/* Quality badge */
#qualityBadge { font-weight: bold; }

/* Mobile adjustments */
@media (max-width: 480px) {
  nav button { padding: 8px; font-size: 14px; }
}
</style>
</head>
<body>

<nav>
  <button id="tabDetailsBtn" class="active" onclick="showTab('details')">Details</button>
  <button id="tabMeasureBtn" onclick="showTab('measure')">Measurements</button>
  <button id="tabResultsBtn" onclick="showTab('results')">Results</button>
</nav>

<!-- TAB 1 -->
<div id="details" class="tab active">
  <h2>Junction Details</h2>
  <label>Site: <input type="text" id="site"></label><br>
  <label>Junction: <input type="text" id="junction"></label><br>
  <label>Arm: <input type="text" id="arm"></label><br>
  <label>Date: <input type="date" id="date"></label><br>
  <label>Distance (m): <input type="number" id="distance"></label><br>
  <button onclick="goToMeasurements()">Go to Measurements ▶</button>
</div>

<!-- TAB 2 -->
<div id="measure" class="tab">
  <h2>Measurements</h2>

  <div class="metrics-bar-top">
    <div>Samples: <span id="sampleCount">0</span></div>
    <div id="qualityBadge">Quality: Poor</div>
  </div>

  <canvas id="canvas"></canvas>

  <div class="metrics-bar-bottom">
    <div><span class="metrics-label">Avg Spd:</span> <span id="avgSpeed" class="metrics-value">-- m/s | -- mph</span></div>
    <div><span class="metrics-label">85%:</span> <span id="p85" class="metrics-value">-- m/s | -- mph</span></div>
  </div>

  <button onclick="toggleMeasurement()">Start / Stop</button>
  <button onclick="deleteLast()">Delete Last</button>
  <button onclick="endSurvey()">End Survey</button>
</div>

<!-- TAB 3 -->
<div id="results" class="tab">
  <h2>Results</h2>
  <pre id="resultsSummary">No results yet.</pre>
</div>

<script>
let measurements = [];
let measuring = false;
let startTime = 0;

// === Tabs ===
function showTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById("tab" + id.charAt(0).toUpperCase() + id.slice(1) + "Btn").classList.add("active");
}

function goToMeasurements() { showTab('measure'); drawCanvas(); }

// === Measurement ===
function toggleMeasurement() {
  if (!measuring) {
    measuring = true;
    startTime = performance.now();
    tick();
  } else {
    measuring = false;
    const elapsed = (performance.now() - startTime) / 1000;
    const distance = parseFloat(document.getElementById('distance').value) || 1;
    const speed = distance / elapsed;
    const mph = speed * 2.23694;
    measurements.push({ time: elapsed, speed, mph });
    updateStats();
    drawCanvas();
  }
}

function deleteLast() { measurements.pop(); updateStats(); drawCanvas(); }
function endSurvey() { showTab('results'); generateResults(); }

// === Stats ===
function updateStats() {
  const n = measurements.length;
  document.getElementById("sampleCount").textContent = n;
  let quality = "Poor";
  if (n >= 100) quality = "Good";
  else if (n >= 50) quality = "Fair";
  else if (n >= 25) quality = "Low";
  document.getElementById("qualityBadge").textContent = "Quality: " + quality;

  if (n > 0) {
    const avg = measurements.reduce((a, m) => a + m.speed, 0) / n;
    const speeds = measurements.map(m => m.speed).sort((a, b) => a - b);
    const p85 = speeds[Math.floor(0.85 * (speeds.length - 1))];
    document.getElementById("avgSpeed").textContent = avg.toFixed(2) + " m/s | " + (avg * 2.23694).toFixed(2) + " mph";
    document.getElementById("p85").textContent = p85.toFixed(2) + " m/s | " + (p85 * 2.23694).toFixed(2) + " mph";
  } else {
    document.getElementById("avgSpeed").textContent = "-- m/s | -- mph";
    document.getElementById("p85").textContent = "-- m/s | -- mph";
  }
}

// === Canvas ===
function drawCanvas() {
  const c = document.getElementById('canvas');
  const ctx = c.getContext('2d');
  c.width = c.clientWidth;
  c.height = c.clientHeight;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.font = "14px monospace";
  ctx.fillStyle = "#000";

  ctx.fillText("#   Time(s)   m/s     mph", 10, 30);

  const reversed = [...measurements].reverse().slice(0, 6); // newest first
  reversed.forEach((m, i) => {
    const line = `${String(measurements.length - i).padEnd(4)}${m.time.toFixed(2).padEnd(10)}${m.speed.toFixed(2).padEnd(8)}${m.mph.toFixed(2)}`;
    ctx.fillText(line, 10, 50 + 20 * i);
  });
}

function tick() { if (measuring) requestAnimationFrame(tick); drawCanvas(); }

// === Results ===
function generateResults() {
  let text = "Results Summary\n\n";
  measurements.forEach((m, i) => {
    text += `${i + 1}\t${m.time.toFixed(2)}s\t${m.speed.toFixed(2)} m/s\t${m.mph.toFixed(2)} mph\n`;
  });
  document.getElementById("resultsSummary").textContent = text;
}
</script>

</body>
</html>
